<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<meta name="description" content="Verify your Navora email."><link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/navora-v7.css">
<script src="/assets/js/theme.js"></script><title>Verify email · Navora</title></head><body>
<nav class="navora-nav container-fluid"><a class="brand" href="index.html"><span class="brand-mark"></span><span>NAVORA</span></a><button aria-label="Change theme" class="icon-btn" data-theme-toggle>◐ Theme</button></nav>
<main class="auth-shell"><form class="card auth-card" id="verify-form">
<span class="chip">Email verification</span><h1>Verify email</h1><div class="form-status hidden" data-form-status aria-live="polite"></div>
<p class="muted">Enter the six-digit one-time code sent to your email. OTPs are hashed server-side and expire.</p>
<div class="muted" id="email-delivery-status" aria-live="polite">Checking email provider…</div>
<label for="email">Email</label><input autocomplete="email" class="input" id="email" required type="email">
<br><label for="otp">OTP</label><input autocomplete="one-time-code" class="input" id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
<div class="toolbar"><button class="btn-navora" type="submit">Verify</button><button class="btn-navora btn-ghost" id="resend-verification" type="button">Resend code</button></div>
<p class="muted"><a href="register.html">Use another account</a></p>
</form></main>
<script src="/assets/js/app-shell.js" type="module"></script><script src="/assets/js/auth.js" type="module"></script>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
