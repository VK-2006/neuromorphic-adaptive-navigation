<!DOCTYPE html>

<html lang="en"><head><link href="https://cdn.jsdelivr.net" rel="preconnect"/><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="/manifest.json" rel="manifest"/><meta content="#ffffff" name="theme-color"/><meta content="Shared Journey in Navora — neuromorphic adaptive navigation, route memory and swarm intelligence." name="description"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/><link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet"/><link href="/assets/css/main.css" rel="stylesheet"/><link href="/assets/css/navora-v7.css" rel="stylesheet"/><script src="/assets/js/theme.js"></script><title>Shared Journey · Navora</title></head><body><nav class="navora-nav container-fluid"><a class="brand" href="index.html"><span class="brand-mark"></span><span>NAVORA</span></a><span class="chip">Controlled trusted-contact view</span></nav><main class="auth-shell"><div class="card auth-card"><span class="eyebrow">Secure journey share</span><h1 id="shared-status">Loading…</h1><p class="muted">This view exposes only authorized journey status, destination, progress, last update and emergency state. It does not provide account access.</p><div class="grid grid-2"><div><small class="muted">Destination</small><div id="shared-destination">—</div></div><div><small class="muted">Progress</small><div id="shared-progress">—</div></div><div><small class="muted">Last update</small><div id="shared-updated">—</div></div><div><small class="muted">Emergency</small><div id="shared-emergency">No</div></div></div><p class="muted" id="shared-location" style="margin-top:18px"></p></div></main><script type="module">import{api,toast}from'/assets/js/api.js';const token=new URLSearchParams(location.search).get('token');async function load(){if(!token)return document.getElementById('shared-status').textContent='Invalid share link';try{const j=await api('/journeys/shared/'+encodeURIComponent(token));document.getElementById('shared-status').textContent=j.status;document.getElementById('shared-destination').textContent=j.destination?.label||'Authorized destination';const total=(j.distanceCovered||0)+(j.distanceRemaining||0);document.getElementById('shared-progress').textContent=total?Math.round(100*(j.distanceCovered||0)/total)+'%':'—';document.getElementById('shared-updated').textContent=new Date(j.updatedAt).toLocaleString();document.getElementById('shared-emergency').textContent=j.emergencyActive?'ACTIVE':'No';document.getElementById('shared-location').textContent=j.lastKnownPosition?`Last authorized position: ${Number(j.lastKnownPosition.lat).toFixed(4)}, ${Number(j.lastKnownPosition.lng).toFixed(4)}`:'No position shared yet'}catch(e){document.getElementById('shared-status').textContent='Link unavailable';toast(e.message,'error')}}load();setInterval(load,15000)</script><script defer="defer" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script defer="defer" src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script defer="defer" src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script><script src="/assets/js/app-shell.js" type="module"></script></body></html>
