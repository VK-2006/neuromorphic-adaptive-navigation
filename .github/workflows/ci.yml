name: Navora CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-and-backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and master-prompt contracts
        run: |
          python scripts/master_prompt_crosscheck.py
          python scripts/repository_crosscheck.py
          python tests/frontend_stack_contracts.py
          python tests/worldclass_ui_contracts.py
          python tests/dom_contracts.py
          python tests/static_assets.py
          python tests/frontend_contracts.py
          python tests/failure_contracts.py
          python tests/accessibility_contracts.py
          python tests/live_navigation_contracts.py
          python tests/verifier_context_contracts.py
          python tests/v17_9_guarded_repair_contracts.py
          python tests/v18_fullstack_media_backend_contracts.py
          python tests/v19_sidebar_light_theme_contracts.py
          python tests/v20_universal_left_navbar_contracts.py
          python tests/v21_true_fixed_sidebar_contracts.py
          python tests/v22_right_pane_scroll_contracts.py
          node --check frontend/assets/js/scroll-surface-v22.js
          node tests/pure-smoke.js
          node tests/performance_smoke.js
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Backend Jest and audit
        working-directory: backend
        run: |
          npm test
          npm audit --audit-level=high
      - name: Mongo-backed runtime E2E
        env:
          NAVORA_E2E_MONGODB_URI: mongodb://127.0.0.1:27017/navora_ci_e2e
        run: node scripts/runtime_e2e.js
      - name: Git hygiene audit
        run: python scripts/prepush_audit.py

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend and Playwright
        working-directory: backend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start Navora test server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/navora_ci_browser
          FRONTEND_URL: http://127.0.0.1:5000
          SOCKET_CORS_ORIGIN: http://127.0.0.1:5000
        run: |
          node backend/src/server.js > /tmp/navora-browser-server.log 2>&1 &
          echo $! > /tmp/navora-browser-server.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Navora browser server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/navora-browser-server.log
          exit 1
      - name: 28-page Chromium runtime sweep
        run: node scripts/browser_v8_full_sweep.js http://127.0.0.1:5000
      - name: V22 fixed-navigation physical scroll E2E
        run: node scripts/browser_v22_fixed_shell_e2e.js http://127.0.0.1:5000
      - name: Camera local/cloud privacy Chromium E2E
        run: node scripts/browser_v11_7_detection_modes_e2e.js http://127.0.0.1:5000
      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/navora-browser-server.log || true

  ai-fallback-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-test.txt
      - name: Install lightweight AI test dependencies
        working-directory: ai-service
        run: pip install -r requirements-test.txt
      - name: AI fallback/API tests
        working-directory: ai-service
        run: pytest tests -q
      - name: AI validation truthfulness
        run: python scripts/model_readiness.py
