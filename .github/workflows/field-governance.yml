name: Navora Field Governance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recorded field profile
        run: python scripts/validate_field_evidence.py --profile field --require-current
      - name: Validate governance contracts
        run: python tests/v38_field_governance_contracts.py
